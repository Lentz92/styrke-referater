name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --locked: run with the versions in uv.lock, and fail if it is out of date.
      - name: Run tests
        run: uv run --locked pytest -q

      - name: Build pages and site from data/
        run: uv run --locked -m styrke.update --render-only
