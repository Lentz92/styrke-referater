name: Update rule overview

on:
  schedule:
    - cron: "0 6 1 * *"  # 06:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Allow a rebuild (--allow-rebuild)"
        type: boolean
        default: false
      full:
        description: "Consolidate in full, to migrate a prompt or version change (--consolidate-mode full)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write  # a result the checks do not trust goes to a pull request (auto/update)

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # update.py starts no new Claude calls after 75 minutes
    env:
      # Pinned: the CLI decides which model an alias means and what list price it reports.
      # To upgrade, change the version here and run the workflow once by hand.
      CLAUDE_CODE_VERSION: "2.1.294"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install uv and Claude Code
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check Claude runs on the subscription
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # An API key takes precedence over the subscription token and would be billed separately.
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is set; refusing to run on API billing."
            exit 1
          fi
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Secret CLAUDE_CODE_OAUTH_TOKEN is missing. Create it with 'claude setup-token'."
            exit 1
          fi
          version=$(claude --version)
          echo "$version"
          if [ "${version%% *}" != "$CLAUDE_CODE_VERSION" ]; then
            echo "::error::Claude Code $version is installed, expected $CLAUDE_CODE_VERSION."
            exit 1
          fi
          claude auth status | grep -E '"(loggedIn|authMethod|apiProvider)"' || true
          # A tiny call proves the token works (and catches expiry) even in months with nothing new,
          # and that this CLI answers a full model id with that model.
          result=$(echo "Reply with only the word ok." | claude -p --tools "" --safe-mode --no-session-persistence \
            --model claude-haiku-5-5 --output-format json)
          echo "$result" | jq '{is_error, result, total_cost_usd, models: [.modelUsage[]?.canonicalModel]}'
          if ! echo "$result" | jq -e '.is_error == false
              and ([.modelUsage[]?.canonicalModel] | index("claude-haiku-5-5") != null)' > /dev/null; then
            echo "::error::The smoke test did not get an answer from claude-haiku-5-5."
            exit 1
          fi

      - name: Download new minutes and update the rule overview
        id: update
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REBUILD: ${{ inputs.rebuild }}
          FULL: ${{ inputs.full }}
        run: |
          # Exit code 0: publish; 3: the checks found errors, so the result goes to a pull request; else the run
          # failed. Record it instead of stopping here, so the next step can route the result. The monthly run
          # passes no option: it consolidates incrementally (update.py's default); a full one migrates a prompt or
          # version change, with the rebuild allowed.
          args=()
          if [ "$REBUILD" = "true" ]; then args+=(--allow-rebuild); fi
          if [ "$FULL" = "true" ]; then args+=(--consolidate-mode full); fi
          set +e
          uv run update.py "${args[@]}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Publish the result, or send it to a pull request for review
        if: steps.update.outputs.code != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.update.outputs.code }}
        run: bash .github/scripts/route-update.sh "$CODE"

      - name: Fail when update.py failed
        # After the routing: partial results are valid cache, kept for the next run when the checks pass.
        if: steps.update.outputs.code != '0' && steps.update.outputs.code != '3'
        env:
          CODE: ${{ steps.update.outputs.code }}
        run: |
          echo "::error::update.py failed (exit code $CODE); see its log above."
          exit 1
