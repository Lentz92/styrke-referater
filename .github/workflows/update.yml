name: Update rule overview

on:
  schedule:
    - cron: "0 6 1 * *"  # 06:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Allow a rebuild (--allow-rebuild)"
        type: boolean
        default: false
      full:
        description: "Consolidate in full, to migrate a prompt or version change (--consolidate-mode full)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write  # a result the checks do not trust goes to a pull request (auto/update)

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # styrke/update.py starts no new Claude calls after 75 minutes
    env:
      DISABLE_AUTOUPDATER: "1"  # keeps the CLI at the version .github/actions/claude-cli pins
    steps:
      - uses: actions/checkout@v5

      - name: Install uv and Claude Code, and check Claude runs on the subscription
        uses: ./.github/actions/claude-cli
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Download new minutes and update the rule overview
        id: update
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REBUILD: ${{ inputs.rebuild }}
          FULL: ${{ inputs.full }}
        run: |
          # Exit code 0: publish; 3: the checks found errors, so the result goes to a pull request; else the run
          # failed. Record it instead of stopping here, so the next step can route the result. The monthly run
          # passes no option: it consolidates incrementally (styrke/update.py's default); a full one migrates a prompt
          # or version change, with the rebuild allowed.
          # --locked: run with the versions in uv.lock, and fail if it is out of date.
          args=()
          if [ "$REBUILD" = "true" ]; then args+=(--allow-rebuild); fi
          if [ "$FULL" = "true" ]; then args+=(--consolidate-mode full); fi
          set +e
          uv run --locked -m styrke.update "${args[@]}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Publish the result, or send it to a pull request for review
        if: steps.update.outputs.code != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.update.outputs.code }}
        run: bash .github/scripts/route-update.sh "$CODE"

      - name: Fail when styrke/update.py failed
        # After the routing: partial results are valid cache, kept for the next run when the checks pass.
        if: steps.update.outputs.code != '0' && steps.update.outputs.code != '3'
        env:
          CODE: ${{ steps.update.outputs.code }}
        run: |
          echo "::error::styrke/update.py failed (exit code $CODE); see its log above."
          exit 1
