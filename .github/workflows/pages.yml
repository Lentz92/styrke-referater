name: Website

# Rebuilds the site from data/ and publishes it on GitHub Pages, only from main and only when checks.py finds no
# errors. Pushes made by the monthly update workflow use GITHUB_TOKEN and do not trigger `push`, so it is chained
# via workflow_run: after a successful update that pushed to main. A failed update, or one whose result went to a
# pull request for review, leaves the site as it is.
on:
  workflow_run:
    workflows: ["Update rule overview"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "data/**"
      - "website/**"
      - "*.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # a queued build waits: cancelling one could leave a monthly update unpublished

jobs:
  # After the monthly update: go ahead only when it succeeded and pushed to main. It leaves main as it was when
  # it had nothing new, or when its result went to a pull request for review.
  gate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.main.outputs.changed }}
    steps:
      - name: Check that the update changed main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          UPDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          changed=true
          if [ "$EVENT" = workflow_run ] \
              && [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$UPDATE_SHA" ]; then
            echo "The update did not change main; the site stays as it is."
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main  # after workflow_run: include the commit the update just pushed

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check the data
        run: uv run checks.py  # errors fail the build, so the site stays as it was

      - name: Build the site
        run: uv run website.py

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
