name: Website

# Rebuilds the site from data/ and publishes it on GitHub Pages. Pushes made by the monthly
# update workflow use GITHUB_TOKEN and do not trigger `push`, so it is chained via workflow_run.
on:
  workflow_run:
    workflows: ["Update rule overview"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "data/**"
      - "website/**"
      - "*.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main  # after workflow_run: include the commit the update just pushed

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the site
        run: uv run website.py

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
