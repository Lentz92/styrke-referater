[project]
name = "styrke-referater"
version = "0"
description = "DSF's rules and agreements, extracted by Claude from the minutes on styrke.dk"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "snowballstemmer>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
]

[tool.uv]
# Not installed: the CLIs run from the checkout (`uv run -m styrke.update`), next to the data folders they read.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
